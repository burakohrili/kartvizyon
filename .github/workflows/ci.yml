name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.6"
          channel: stable
          cache: true
      # Codemagic ile aynı JDK; Gradle sürümü farkı derleme hatası üretiyor.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run check
      # `npm run check` mobil tarafta yalnız `flutter analyze` ve `flutter test`
      # çalıştırır; ikisi de Gradle'a hiç uğramaz. Android bağımlılık sorunları
      # (AAR metadata, core library desugaring) ancak gerçek bir derlemede
      # ortaya çıkar. 18 Ağustos 2026'da saha moduyla gelen
      # flutter_local_notifications desugaring istedi ve üst üste üç Codemagic
      # release build'i düştü; gate yeşil olduğu için bu ancak mağazaya hiçbir
      # şey düşmediği fark edilince görüldü.
      - name: Compile the Android app
        working-directory: apps/mobile
        run: flutter build apk --debug
