workflows:
  kartvizyon-android-release:
    name: KartVizyon Android signed AAB
    max_build_duration: 60
    # main'e push edildiğinde otomatik çalışır. Bunun için GitHub deposunda
    # https://api.codemagic.io/hooks/<appId> adresine bakan bir webhook bulunmalıdır;
    # webhook yoksa Codemagic push'tan haberdar olmaz ve tetikleyici sessizce çalışmaz.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    # Yalnız mobil uygulamayı veya CI tanımını etkileyen commit'lerde derle;
    # doküman ve web değişiklikleri mobil build dakikası harcamasın.
    when:
      changeset:
        includes:
          - "apps/mobile"
          - "codemagic.yaml"
    # Personal accounts receive free build minutes on the macOS M2 runner.
    # Linux X2 requires billing even for Android-only workflows.
    instance_type: mac_mini_m2
    working_directory: apps/mobile
    environment:
      groups:
        - mobile_runtime
      android_signing:
        - kartvizyon_upload
      vars:
        PACKAGE_NAME: app.kartvizyon.mobile
      # .github/workflows/ci.yml ile aynı sürüme sabitlenir. `stable` kayan bir
      # kanaldır; testlerin geçtiği sürümle mağazaya giden ikilinin sürümü
      # ayrışırsa release build'i hiç doğrulanmamış bir toolchain'le üretilir.
      # Nitekim stable 8.14+ Gradle istemeye başlayınca build kırıldı.
      # Flutter yükseltmesi ayrı ve test edilmiş bir değişiklik olmalıdır.
      flutter: 3.32.6
      java: 17
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Create isolated Android signing configuration
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Resolve dependencies
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze
      - name: Unit and widget tests
        script: flutter test
      - name: Build signed Android App Bundle
        script: |
          flutter build appbundle --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define=KARTVIZYON_API_URL=https://app.kartvizyon.app \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=SENTRY_DSN=$SENTRY_DSN
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
      - flutter_drive.log
    # iOS tarafı TestFlight'a kendi gidiyordu ama Android AAB elle indirilip
    # yükleniyordu. Play service account'u (yalnız KartVizyon'un sürüm iznine
    # sahip) bağlandığı için artık kapalı test kanalına doğrudan düşer.
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: alpha
        # Sürüm taslak değil, doğrudan test kullanıcılarına açılır.
        submit_as_draft: false

  kartvizyon-ios-testflight:
    name: KartVizyon iOS signed IPA / TestFlight
    max_build_duration: 90
    # Otomatik tetiklemede `inputs` varsayılanları uygulanır; submitToTestFlight
    # varsayılan olarak false olduğu için push ile yalnız imzalı IPA üretilir,
    # TestFlight'a yükleme yapılmaz. Yükleme için build elle veya API ile
    # submitToTestFlight=true verilerek başlatılır.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - "apps/mobile"
          - "codemagic.yaml"
    instance_type: mac_mini_m2
    working_directory: apps/mobile
    inputs:
      submitToTestFlight:
        description: Upload the verified build to TestFlight
        type: boolean
        # main'e giden her doğrulanmış build dahili test grubuna teslim edilir.
        # Grup şu an yalnız iç testçilerden oluştuğu için bildirim gürültüsü
        # yaratmaz. Dış test grubu açıldığında bu varsayılan tekrar false
        # yapılıp yükleme elle tetiklenmelidir.
        default: true
    integrations:
      app_store_connect: kartvizyon_app_store
    environment:
      groups:
        - mobile_runtime
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.kartvizyon.mobile
      # .github/workflows/ci.yml ile aynı sürüme sabitlenir. `stable` kayan bir
      # kanaldır; testlerin geçtiği sürümle mağazaya giden ikilinin sürümü
      # ayrışırsa release build'i hiç doğrulanmamış bir toolchain'le üretilir.
      # Nitekim stable 8.14+ Gradle istemeye başlayınca build kırıldı.
      # Flutter yükseltmesi ayrı ve test edilmiş bir değişiklik olmalıdır.
      flutter: 3.32.6
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Resolve dependencies
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze
      - name: Unit and widget tests
        script: flutter test
      - name: Install CocoaPods dependencies
        script: find ios -name Podfile -execdir pod install \;
      - name: Apply KartVizyon-only iOS signing profiles
        script: xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=KARTVIZYON_API_URL=https://app.kartvizyon.app \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=SENTRY_DSN=$SENTRY_DSN
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: ${{ inputs.submitToTestFlight }}
